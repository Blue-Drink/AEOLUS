<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Archivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="body-subir">

    <div class="file-upload-wrapper">
        <h2 style="margin-top:0;">Subir a la nube</h2>
        <p>Selecciona el archivo que deseas guardar</p>
        
        <form action="subir.php" method="post" enctype="multipart/form-data">
            <input type="file" name="archivo" required style="border: 2px dashed #ccc; padding: 20px; width: 100%;">
            
            <input type="hidden" name="directorio_destino" id="dir_input">
            
            <br><br>
            <input type="submit" value="Comenzar Subida">
            
            <br>
            <a href="javascript:history.back()">Cancelar y Volver</a>
        </form>
    </div>

    <script>
        // Javascript para obtener la carpeta de la URL
        const params = new URLSearchParams(window.location.search);
        document.getElementById('dir_input').value = params.get('dir') || '';
    </script>

</body>
</html>
