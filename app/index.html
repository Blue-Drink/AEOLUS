<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="AEOLUS.png">
    
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="body-login">

    <table id="banner">
        <tr>
            <td>Bienvenido a AEOLUS CLOUD</td>
        </tr>
    </table>

    <div class="logo-container">
        <img src="AEOLUS.png" alt="Logo Aeolus">
    </div>

    <form action="log.php" method="post" class="form-login">
        <h2 style="text-align:center; color:#333; margin-top:0;">Iniciar Sesión</h2>

        <label style="display:block; margin-bottom:5px; color:#666;">Usuario</label>
        <input type="text" id="usuario" name="usuario" required style="width:100%; margin-bottom:15px; box-sizing:border-box;">

        <label style="display:block; margin-bottom:5px; color:#666;">Contraseña</label>
        <div class="password-wrapper">
            <input type="password" id="clave" name="clave" required style="width:100%; margin-bottom:20px; box-sizing:border-box;">
            <span id="togglePassword" class="toggle-icon">👁️</span>
        </div>
        

        <input type="submit" value="Entrar">
        
        <div style="justify-content:center; margin-top:15px; display:flex; align-items:baseline; gap:15px">
            <a href="./registro.html" style="font-size:0.9em;">Registrarse</a>
            <a href="./recuperar.html" style="font-size:0.9em;">Recuperar contraseña</a>
        </div>
    </form>

    <div class="footer-login">
        Proyecto hecho por Pablo Porras, Isaac Rios y Patricia Ortiz © 2026
    </div>

    <script src="togglePassword.js" defer></script>
</body>
</html>
